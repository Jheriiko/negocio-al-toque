name: Separar Pista (Demucs)

on:
  workflow_dispatch:

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cachear paquetes de Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: \${{ runner.os }}-pip-demucs

      - name: Cachear Modelos de Demucs
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: \${{ runner.os }}-demucs-torch-models-v1

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U demucs

      - name: Separar con Demucs (Archivo Local)
        run: |
          demucs --two-stems=vocals --mp3 cancion.mp3

      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: pistas-separadas
          path: separated/

name: Render Negocio al Toque (FFmpeg Puro)
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests pillow
      - name: Generar Video
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
        run: python render_cloud.py
      - name: Subir Video
        uses: actions/upload-artifact@v4
        with:
          name: video-comic
          path: video_final.mp4

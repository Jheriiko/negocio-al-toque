name: Render Negocio al Toque
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # RESTAURAR CACHÉ DE IMÁGENES
      - name: Restaurar Caché de Imágenes
        uses: actions/cache@v4
        with:
          path: cache
          key: cloudflare-images-v1-${{ hashFiles('guion.json') }}
          
      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          pip install edge-tts requests pillow
      - name: Instalar Node Dependencies
        run: npm install
      - name: Descargar Chrome Headless Shell
        run: npx remotion browser ensure
      - name: Generar Assets (Cloudflare + Caché)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python render_cloud.py
      - name: Renderizar Video
        run: npx remotion render src/index.ts TechUcronia video_final.mp4 --props=props.json
      - name: Subir Video
        uses: actions/upload-artifact@v4
        with:
          name: video-comic
          path: video_final.mp4

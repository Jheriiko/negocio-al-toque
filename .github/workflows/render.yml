name: Render Negocio al Toque
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable
          pip install edge-tts requests
      - name: Instalar Node Dependencies
        run: npm install
      - name: Generar Assets (Cloudflare FLUX.1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python render_cloud.py
      - name: Renderizar Video
        run: npx remotion render src/index.ts TechUcronia video_final.mp4 --props=props.json
      - name: Subir Video
        uses: actions/upload-artifact@v4
        with:
          name: video-comic
          path: video_final.mp4
